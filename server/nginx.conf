server {
  server_name txrx.unrest.io;

  client_max_body_size 24M;

  location /favicon.ico {
    alias /home/django/projects/txrx.org/.static/favicon.ico;
  }
  location /shop/products.js {
    alias /home/django/projects/txrx.org/.static/products.js;
  }
  location /static/ {
    alias /home/django/projects/txrx.org/.static/;
    error_page 404 = /static/404.html;
    expires 24h;
    gzip on;
    gzip_min_length 1000;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain application/xml text/css application/javascript application/octet-stream;
    gzip_buffers 128 4k;
  }
  # served through django to force authentication
  location /media/signatures/ {
    proxy_pass http://127.0.0.1:3033;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /media/ {
    alias /home/django/projects/txrx.org/.media/;
    error_page 404 = /static/404.html;
    expires 24h;
  }
  location / {
    proxy_pass http://127.0.0.1:3033;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/txrx.unrest.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/txrx.unrest.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = txrx.unrest.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  server_name txrx.unrest.io;
    listen 80;
    return 404; # managed by Certbot


}