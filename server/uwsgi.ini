[uwsgi]
uid = django
gid = django
base = /home/django/projects/txrx.org

chdir = %(base)
virtualenv = %(base)/.venv
module = main.wsgi:application

master = true
processes = 1

; nginx proxies with `proxy_pass http://127.0.0.1:3033` (see nginx-dev.conf),
; so speak HTTP directly rather than the uwsgi wire protocol.
http-socket = 127.0.0.1:3033

harakiri = 180
socket-timeout = 180
safe-pidfile = /tmp/txrx.pid
logto = /home/django/uwsgi-txrx.log

; recycle workers so long requests (ics feeds, bulk email) can't leak them,
; and cap per-worker memory so a slow leak can't accumulate (see backlog notes)
max-requests = 500
reload-on-rss = 120
vacuum = true
die-on-term = true

; low-traffic legacy site on a memory-pressured box: no workers until a
; request arrives, and stop idle workers after 10 minutes
cheap = true
idle = 600
