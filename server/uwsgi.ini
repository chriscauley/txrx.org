[uwsgi]
project = txrx
uid = clepsy
; NOTE: base is the repo root, not %(base)/server like maptroid — this app
; keeps its Django code at the repo root (it hasn't adopted the server/ split).
base = /home/%(uid)/projects/txrx.org

chdir = %(base)
virtualenv = %(base)/.venv
module = main.wsgi:application

master = true
processes = 1

; nginx does `proxy_pass http://127.0.0.1:3033`; speak HTTP on the socket
; directly rather than running uwsgi's separate `http` router process.
http-socket = 127.0.0.1:3033

safe-pidfile = /tmp/%(project).pid

; Was /home/django/uwsgi-txrx.log — a log for one app sitting loose in a home
; directory. Every project on the box now logs to <project_root>/logs/uwsgi.log
; so the logs sit next to the code they came from and one logrotate glob covers
; them all. log-reopen makes uwsgi reopen the file after rotation rather than
; writing to the rotated-away inode.
logto = %(base)/logs/uwsgi.log
log-reopen = true

; Recycle workers to cap memory on this shared, memory-pressured box.
; 250, not 120: a healthy worker on the heavier apps plateaus near 110 MB, so
; 120 recycles on ordinary request variation rather than on a leak. Uniform
; across the box's apps.
max-requests = 500
reload-on-rss = 250

; low-traffic legacy site: no workers until a request; stop idle after 10 min
cheap = true
idle = 600
vacuum = true
die-on-term = true
